# ───────────────────────────────────────────────────────────────
# 관심 지역 설정 — 여기만 고치면 알림 대상 지역이 바뀝니다.
#
#  - address_keywords: 분양 공고의 공급위치(주소)에 이 단어가 들어가면 해당 지역으로 매칭
#  - lawd_cd        : 주변 실거래가 조회용 법정동 시군구 코드(5자리)
#  - umd_keywords   : (선택) 같은 시군구 안에서 특정 동만 비교하고 싶을 때 (예: 동탄)
# ───────────────────────────────────────────────────────────────
regions:
  # ⚠️ [임시 테스트] 클라우드 발송 확인용 — 검증 끝나면 이 4줄을 지우세요.
  - name: "테스트 수원"
    address_keywords: ["수원"]
    lawd_cd: "41113"   # 수원시 권선구

  - name: "용인 수지구"
    address_keywords: ["수지구", "용인시 수지"]
    lawd_cd: "41465"

  - name: "용인 기흥구"
    address_keywords: ["기흥구", "용인시 기흥"]
    lawd_cd: "41463"

  - name: "용인 처인구"
    address_keywords: ["처인구", "용인시 처인"]
    lawd_cd: "41461"

  - name: "화성 동탄"
    address_keywords: ["동탄"]
    # 2026.2 화성시 구 신설로 코드 변경: 41597=동탄구, 41595=병점구(동탄1 일부)
    lawd_cd: ["41597", "41595"]
    # 동탄1·2신도시 주요 법정동만 시세 비교 대상으로 (화성시 전체 평균에 농촌지역이 섞이지 않도록)
    umd_keywords: ["청계동", "영천동", "오산동", "반송동", "능동", "산척동",
                   "목동", "장지동", "송동", "방교동", "금곡동", "신동",
                   "중동", "석우동", "반정동", "남양", "기산동"]

  - name: "인천 검단신도시"
    address_keywords: ["검단", "원당동", "당하동", "마전동", "불로동", "대곡동", "왕길동", "아라동"]
    lawd_cd: "28260"   # 인천 서구
    # 서구 전체엔 청라·가정 등 다른 생활권이 섞여 있어, 검단신도시 법정동만 시세 비교
    umd_keywords: ["원당동", "당하동", "마전동", "불로동", "대곡동", "아라동",
                   "금곡동", "오류동", "왕길동"]

# ───────────────────────────────────────────────────────────────
# 분양 공고 필터
# ───────────────────────────────────────────────────────────────
filters:
  house_secd: "01"        # 01 = APT (아파트)
  house_dtl_secd: "01"    # 01 = 민영주택(민간분양)  /  03 = 국민주택(공공분양)
  # 모집공고일이 최근 N일 이내인 공고만 대상 (과거 공고 재알림 방지)
  recent_days: 30

  # 일반 민간분양 외에 추가로 받을 공고 종류 (true/false)
  include_private: true       # 민간분양(민영 APT)
  include_unranked: true      # 무순위/잔여세대 (줍줍)
  include_resupply: true      # 불법행위 재공급 (계약취소 재공급)

  # 청약 접수가 이미 끝난 공고는 알림에서 제외 (넣을 수 없는 청약 = 노이즈)
  skip_closed: true

# ───────────────────────────────────────────────────────────────
# 시세 비교 / 점수 설정
# ───────────────────────────────────────────────────────────────
scoring:
  trade_months: 6            # 최근 N개월 실거래를 시세 산정에 사용
  area_tolerance: 0.15       # 분양 전용면적 ±15% 범위의 실거래만 비교 대상
  min_trades: 3              # 시세 신뢰를 위한 최소 실거래 건수 (미만이면 '데이터 부족')
  notify_min_score: 0        # 이 점수 이상만 알림 (0 = 매칭된 민간분양 전부 알림)
